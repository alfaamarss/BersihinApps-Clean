name: Deploy Laravel to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'smart-environment-web/**'
      - '.github/workflows/azure-laravel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, mysqli, pdo_mysql, pdo_pgsql, redis, xml, zip
          tools: composer

      - name: Install Composer dependencies
        working-directory: smart-environment-web
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: smart-environment-web/package-lock.json

      - name: Install Node dependencies
        working-directory: smart-environment-web
        run: npm ci

      - name: Build frontend assets
        working-directory: smart-environment-web
        run: npm run build

      - name: Package Laravel application
        working-directory: smart-environment-web
        run: |
          zip -r "$GITHUB_WORKSPACE/release.zip" . \
            -x ".git/*" \
               "node_modules/*" \
               ".env" \
               ".env.*" \
               "tests/*" \
               "storage/logs/*" \
               "storage/framework/cache/*" \
               "storage/framework/sessions/*" \
               "storage/framework/views/*" \
               "storage/framework/testing/*"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: bersihinapps-api-iti-2026
          package: ${{ github.workspace }}/release.zip

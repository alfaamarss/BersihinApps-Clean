name: Deploy Flutter Web to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'smart-environment-mobile/**'
      - '.github/workflows/azure-flutter-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter Web
        working-directory: smart-environment-mobile
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=https://bersihinapps-api-iti-2026.azurewebsites.net/api/v1

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: smart-environment-mobile/build/web
          api_location: ''
          output_location: ''
          skip_app_build: true